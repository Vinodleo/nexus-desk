<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#334155" stroke-width="3" opacity="0.6"/>

  <!-- Candlestick chart grid & trading node motifs -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,8">
    <line x1="96" y1="128" x2="416" y2="128" />
    <line x1="96" y1="256" x2="416" y2="256" />
    <line x1="96" y1="384" x2="416" y2="384" />
    <line x1="160" y1="96" x2="160" y2="416" />
    <line x1="256" y1="96" x2="256" y2="416" />
    <line x1="352" y1="96" x2="352" y2="416" />
  </g>

  <!-- Central Nexus Diamond / Hex Lattice -->
  <g filter="url(#glow)">
    <!-- Outer hexagon -->
    <polygon points="256,96 384,176 384,336 256,416 128,336 128,176" fill="none" stroke="url(#cyanGrad)" stroke-width="10" stroke-linejoin="round"/>
    
    <!-- Dynamic ascending chart line / arrow through nexus -->
    <path d="M150,330 L220,270 L280,310 L370,180" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Candlestick bodies -->
    <!-- Bar 1 (Green) -->
    <line x1="220" y1="230" x2="220" y2="290" stroke="#34d399" stroke-width="3"/>
    <rect x="214" y="245" width="12" height="30" rx="2" fill="#10b981"/>

    <!-- Bar 2 (Cyan peak) -->
    <line x1="280" y1="270" x2="280" y2="340" stroke="#38bdf8" stroke-width="3"/>
    <rect x="274" y="285" width="12" height="35" rx="2" fill="#0ea5e9"/>

    <!-- Bar 3 (Breakout) -->
    <line x1="370" y1="140" x2="370" y2="220" stroke="#34d399" stroke-width="4"/>
    <rect x="362" y="160" width="16" height="40" rx="3" fill="#10b981"/>

    <!-- Central Node Core -->
    <circle cx="256" cy="256" r="28" fill="#09090b" stroke="url(#cyanGrad)" stroke-width="6"/>
    <circle cx="256" cy="256" r="12" fill="#38bdf8"/>
  </g>

  <!-- Brand Typography / Subtext -->
  <text x="256" y="465" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" letter-spacing="8">NEXUS</text>
</svg>
