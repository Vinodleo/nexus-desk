# Nexus Desk on Fly.io: one always-running machine in Singapore, with a disk for
# the state the server keeps (guardian positions, live-order records, desk
# settings, tracked setups). See docs/hosting.md, "C. Fly.io".
#
# The app name must be unique on Fly. If "nexus-desk-vinodleo" is taken,
# pick another and change it here and in the setup commands.

app = "nexus-desk-vinodleo"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  NEXUS_DATA_DIR = "/data"

[[mounts]]
  source = "nexus_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Never stop: the scanner and the position guardian must keep running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    # 503 when the scanner's candle-close loop has stopped.
    grace_period = "60s"
    interval = "60s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
