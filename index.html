<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Nexus Desk</title>
    <meta name="description" content="Nexus Desk - Institutional Autonomous Paper-Trading Terminal with Multi-Agent Swarm, Walk-Forward Lab, and Fail-Closed Risk Execution" />
    <meta name="theme-color" content="#F6F3EE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NexusDesk" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Nexus Desk" />
    <meta property="og:description" content="Nexus Desk - Institutional Autonomous Paper-Trading Terminal with Multi-Agent Swarm, Walk-Forward Lab, and Fail-Closed Risk Execution" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-canvas text-ink antialiased overflow-x-hidden w-full">
    <div id="root" class="w-full overflow-x-hidden min-h-screen bg-canvas"></div>
    <script>
      // The theme chosen in Settings (src/services/theme.ts), before the app draws.
      try {
        var t = localStorage.getItem("nexus_theme");
        var bars = { ivory: "#F6F3EE", graphite: "#141311", blush: "#FBF0F2" };
        if (bars[t]) {
          document.documentElement.dataset.theme = t;
          document.querySelector('meta[name="theme-color"]').setAttribute("content", bars[t]);
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
